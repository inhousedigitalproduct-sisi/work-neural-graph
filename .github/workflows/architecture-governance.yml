name: Architecture Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r testing/requirements.txt

      - name: Resolve comparison base
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Validate architecture docs
        run: python testing/scripts/validate_architecture_docs.py

      - name: Screen architecture and test impact
        run: python testing/scripts/screen_change.py --base "${{ steps.diff.outputs.base }}" --head "${{ steps.diff.outputs.head }}"

      - name: Run impacted tests
        run: python testing/scripts/run_changed_tests.py --base "${{ steps.diff.outputs.base }}" --head "${{ steps.diff.outputs.head }}"
