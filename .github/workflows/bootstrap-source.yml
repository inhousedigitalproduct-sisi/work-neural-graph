name: Bootstrap Work Neural Graph source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bootstrap archive
        id: check
        shell: bash
        run: |
          if [ -f .bootstrap/part00 ] && [ -f .bootstrap/a1a ] && [ -f .bootstrap/a1b ] && [ -f .bootstrap/fixA ] && [ -f .bootstrap/gapA2 ] && [ -f .bootstrap/part01 ] && [ -f .bootstrap/gapB1 ] && [ -f .bootstrap/b2a ] && [ -f .bootstrap/b2b ] && [ -f .bootstrap/fixB ] && [ -f .bootstrap/rem09 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and extract source
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          cat \
            .bootstrap/part00 \
            .bootstrap/a1a \
            .bootstrap/a1b \
            .bootstrap/fixA \
            .bootstrap/gapA2 \
            .bootstrap/part01 \
            .bootstrap/gapB1 \
            .bootstrap/b2a \
            .bootstrap/b2b \
            .bootstrap/fixB \
            .bootstrap/rem00 \
            .bootstrap/rem01 \
            .bootstrap/rem02 \
            .bootstrap/rem03 \
            .bootstrap/rem04 \
            .bootstrap/rem05 \
            .bootstrap/rem06 \
            .bootstrap/rem07 \
            .bootstrap/rem08 \
            .bootstrap/rem09 > source.b64
          echo "Combined base64 bytes: $(wc -c < source.b64)"
          sha256sum source.b64
          base64 --decode source.b64 > source.zip
          echo "Decoded ZIP bytes: $(wc -c < source.zip)"
          set +e
          unzip -o source.zip
          unzip_status=$?
          set -e
          if [ "$unzip_status" -gt 1 ]; then
            exit "$unzip_status"
          fi
          rm -rf .bootstrap source.b64 source.zip

      - name: Commit extracted source
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Work Neural Graph source" || exit 0
          git push origin HEAD:main
