name: Bootstrap Work Neural Graph source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check bootstrap archive
        id: check
        shell: bash
        run: |
          if [ -f .bootstrap/part00 ] && [ -f .bootstrap/part01 ] && [ -f .bootstrap/gapA1 ] && [ -f .bootstrap/gapA2 ] && [ -f .bootstrap/gapB1 ] && [ -f .bootstrap/gapB2 ] && [ -f .bootstrap/rem09 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and extract source
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          wc -c .bootstrap/part00 .bootstrap/gapA1 .bootstrap/gapA2 .bootstrap/part01 .bootstrap/gapB1 .bootstrap/gapB2 .bootstrap/rem* || true
          cat \
            .bootstrap/part00 \
            .bootstrap/gapA1 \
            .bootstrap/gapA2 \
            .bootstrap/part01 \
            .bootstrap/gapB1 \
            .bootstrap/gapB2 \
            .bootstrap/rem00 \
            .bootstrap/rem01 \
            .bootstrap/rem02 \
            .bootstrap/rem03 \
            .bootstrap/rem04 \
            .bootstrap/rem05 \
            .bootstrap/rem06 \
            .bootstrap/rem07 \
            .bootstrap/rem08 \
            .bootstrap/rem09 > source.b64
          echo "Combined base64 bytes: $(wc -c < source.b64)"
          base64 --decode --ignore-garbage source.b64 > source.zip
          echo "Decoded ZIP bytes: $(wc -c < source.zip)"
          unzip -t source.zip
          unzip -o source.zip
          rm -rf .bootstrap source.b64 source.zip

      - name: Commit extracted source
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import Work Neural Graph source" || exit 0
          git push origin HEAD:main
