[llm]
default_provider = openai
timeout_seconds = 180

[openai]
model = gpt-5-mini
api_key_env = OPENAI_API_KEY

[ollama]
host = http://localhost:11434
model = qwen3.5:4b

[embedding]
enabled = false
provider = ollama
model = qwen3-embedding:0.6b

[analytics]
llm_enabled = true
llm_role = interpretation
